apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-security-headers
  namespace: ${NAMESPACE}
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    sslRedirect: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-ratelimit
  namespace: ${NAMESPACE}
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-cors
  namespace: ${NAMESPACE}
spec:
  headers:
    accessControlAllowOriginList:
      - "*"
    accessControlAllowMethods:
      - "GET,POST,PUT,DELETE,OPTIONS"
    accessControlAllowHeaders:
      - "Authorization,Content-Type"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-route
  namespace: ${NAMESPACE}
spec:
  entryPoints:
    - ${ENTRYPOINT}
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1`) || PathPrefix(`/actuator`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      services:
        - name: app-service
          port: 80
      middlewares:
        - name: app-security-headers
        - name: app-cors
        - name: app-ratelimit
