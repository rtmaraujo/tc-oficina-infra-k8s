apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: ${NAMESPACE}
  labels:
    app: tc-oficina

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tc-oficina

  template:
    metadata:
      labels:
        app: tc-oficina

    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: ${ECR_IMAGE}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # Startup lento (~90-100s: agente New Relic + t3.small). startupProbe cobre
          # o periodo de boot; liveness/readiness so agem depois.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3