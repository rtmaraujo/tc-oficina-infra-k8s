apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  DB_URL: "${DB_URL}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  NEW_RELIC_APP_NAME: "${NEW_RELIC_APP_NAME_AUTH}"
  NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY}"
  NEW_RELIC_LOG_LEVEL: "info"