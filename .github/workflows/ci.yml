name: CI/CD - Infra Kubernetes

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  TF_VERSION: 1.6.6
  AWS_REGION: us-west-2
  TF_STATE_BUCKET: tc-oficina-terraform-state

jobs:
  validate-k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Renderizar e Validar Manifestos Kubernetes
        env:
          NAMESPACE: tc-oficina
          RDS_ENDPOINT: localhost:5432
          ECR_IMAGE: 000000000000.dkr.ecr.us-west-2.amazonaws.com/tc-oficina:dummy
          NODE_PORT: 30080
          NODE_PORT_AUTH: 30082
          AUTH_IMAGE: 000000000000.dkr.ecr.us-west-2.amazonaws.com/tc-oficina:auth-dummy
          DB_URL: jdbc:postgresql://localhost:5432/oficina_db
          DB_USER: dummy
          DB_PASSWORD: dummy
          SPRING_DATASOURCE_PASSWORD: dummy
          ADMIN_USUARIO: dummy
          ADMIN_SENHA: dummy
          JWT_SECRET: dummy
          NEW_RELIC_APP_NAME: dummy
          NEW_RELIC_APP_NAME_AUTH: dummy
          NEW_RELIC_LICENSE_KEY: dummy
          NEW_RELIC_LOG_LEVEL: info
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p rendered
          for f in k8s/*.yaml; do
            envsubst < "$f" > "rendered/$(basename "$f")"
          done
          kubeconform -summary -strict rendered/*.yaml

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (local)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/homologacao'
    needs: terraform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Garantir Bucket de State
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled || true
        env:
          TF_STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Init (backend)
        run: terraform init -reconfigure

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
          TF_VAR_ecr_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_ecr_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_ecr_session_token: ${{ secrets.AWS_SESSION_TOKEN }}

  apply-producao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Garantir Bucket de State
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled || true
        env:
          TF_STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Init (backend)
        run: terraform init -reconfigure

      - name: Terraform Apply (producao)
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
          TF_VAR_ecr_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_ecr_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_ecr_session_token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Outputs
        run: terraform output